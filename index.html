<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>L'OMBRE — Générateur de paroles</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,700&family=Crimson+Text:wght@400;600&display=swap" rel="stylesheet" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #0A0A0A; color: #E8E0D5; min-height: 100vh; font-family: 'Crimson Text', Georgia, serif; background-image: radial-gradient(ellipse at 20% 10%, rgba(196,146,58,0.06) 0%, transparent 50%), radial-gradient(ellipse at 80% 90%, rgba(30,45,80,0.12) 0%, transparent 50%); }
    header { border-bottom: 1px solid rgba(196,146,58,0.2); padding: 2.5rem 2rem 2rem; text-align: center; }
    .header-label { font-family: 'Playfair Display', Georgia, serif; font-size: 0.6rem; letter-spacing: 0.3em; color: #C4923A; text-transform: uppercase; margin-bottom: 0.8rem; }
    h1 { font-family: 'Playfair Display', Georgia, serif; font-size: clamp(2.8rem, 8vw, 5rem); font-style: italic; color: #F0E8DC; letter-spacing: -0.02em; line-height: 1; }
    .divider { width: 40px; height: 1px; background: #C4923A; margin: 1.2rem auto 1rem; opacity: 0.5; }
    .subtitle { font-family: 'Playfair Display', Georgia, serif; font-size: 0.75rem; color: #5A5248; letter-spacing: 0.1em; font-style: italic; }
    main { max-width: 660px; margin: 0 auto; padding: 2.5rem 1.5rem; }
    .section-label { font-family: 'Playfair Display', Georgia, serif; font-size: 0.6rem; letter-spacing: 0.2em; color: #C4923A; text-transform: uppercase; margin-bottom: 1rem; }
    .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.6rem; margin-bottom: 1.5rem; }
    .btn-select { background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.07); border-radius: 4px; padding: 0.65rem 0.4rem; color: #8A7F72; cursor: pointer; transition: all 0.2s; text-align: center; font-family: 'Playfair Display', Georgia, serif; font-size: 0.68rem; letter-spacing: 0.03em; }
    .btn-select:hover { border-color: rgba(196,146,58,0.3); color: #C4923A; }
    .btn-select.active { background: rgba(196,146,58,0.15); border-color: rgba(196,146,58,0.5); color: #C4923A; }
    .btn-icon { font-size: 1rem; margin-bottom: 0.25rem; }
    .custom-label { font-family: 'Playfair Display', Georgia, serif; font-size: 0.6rem; letter-spacing: 0.2em; color: #5A5248; text-transform: uppercase; margin-bottom: 0.7rem; margin-top: 1.5rem; }
    textarea { width: 100%; background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.08); border-radius: 4px; padding: 0.9rem 1rem; color: #E8E0D5; font-family: 'Crimson Text', Georgia, serif; font-size: 0.95rem; resize: none; outline: none; line-height: 1.6; margin-bottom: 1.5rem; }
    textarea::placeholder { color: #3A3530; }
    .main-btn { width: 100%; padding: 1.1rem; background: rgba(196,146,58,0.18); border: 1px solid rgba(196,146,58,0.3); border-radius: 4px; color: #C4923A; font-family: 'Playfair Display', Georgia, serif; font-size: 0.7rem; letter-spacing: 0.2em; text-transform: uppercase; cursor: pointer; transition: all 0.2s; }
    .main-btn:disabled { background: rgba(196,146,58,0.05); color: #3A3530; cursor: not-allowed; }
    #error { margin-top: 1rem; color: #8B3A3A; font-family: 'Playfair Display', Georgia, serif; font-size: 0.8rem; text-align: center; display: none; }
    #lyrics-section { margin-top: 3rem; border-top: 1px solid rgba(196,146,58,0.12); padding-top: 2.5rem; display: none; }
    .lyrics-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; }
    .lyrics-label { font-family: 'Playfair Display', Georgia, serif; font-size: 0.55rem; letter-spacing: 0.25em; color: #3A3530; text-transform: uppercase; }
    .save-btn { background: rgba(196,146,58,0.1); border: 1px solid rgba(196,146,58,0.25); border-radius: 4px; padding: 0.4rem 0.8rem; color: #C4923A; font-family: 'Playfair Display', Georgia, serif; font-size: 0.6rem; letter-spacing: 0.1em; text-transform: uppercase; cursor: pointer; }
    .section-tag { color: #C4923A; font-family: 'Playfair Display', Georgia, serif; font-size: 0.65rem; letter-spacing: 0.18em; text-transform: uppercase; margin-top: 1.8rem; margin-bottom: 0.4rem; }
    .lyric-line { line-height: 1.85; color: #E8E0D5; font-size: 0.95rem; padding: 0.1rem 0; border-radius: 2px; cursor: text; }
    .lyric-line:focus { outline: 1px solid rgba(196,146,58,0.3); background: rgba(196,146,58,0.05); padding-left: 0.3rem; }
    .action-row { display: flex; gap: 0.6rem; margin-top: 2.5rem; }
    .sec-btn { flex: 1; background: transparent; border: 1px solid rgba(255,255,255,0.07); border-radius: 4px; padding: 0.7rem; color: #5A5248; font-family: 'Playfair Display', Georgia, serif; font-size: 0.6rem; letter-spacing: 0.15em; text-transform: uppercase; cursor: pointer; }
    #saved-section { margin-top: 3rem; border-top: 1px solid rgba(196,146,58,0.08); padding-top: 2rem; display: none; }
    .saved-title { font-family: 'Playfair Display', Georgia, serif; font-size: 0.6rem; letter-spacing: 0.2em; color: #C4923A; text-transform: uppercase; margin-bottom: 1rem; }
    .saved-item { background: rgba(255,255,255,0.02); border: 1px solid rgba(255,255,255,0.05); border-radius: 4px; padding: 0.8rem 1rem; margin-bottom: 0.6rem; cursor: pointer; display: flex; justify-content: space-between; align-items: center; }
    .saved-item-title { font-family: 'Playfair Display', Georgia, serif; font-size: 0.8rem; color: #8A7F72; }
    .saved-item-date { font-size: 0.65rem; color: #3A3530; }
    .delete-saved { background: none; border: none; color: #5A3A3A; cursor: pointer; font-size: 0.9rem; padding: 0 0.3rem; }
    footer { text-align: center; padding: 2rem; border-top: 1px solid rgba(255,255,255,0.04); color: #2A2520; font-size: 0.6rem; letter-spacing: 0.15em; font-family: 'Playfair Display', Georgia, serif; margin-top: 3rem; }
  </style>
</head>
<body>
<header>
  <div class="header-label">Générateur de paroles IA</div>
  <h1>L'OMBRE</h1>
  <div class="divider"></div>
  <p class="subtitle">Creil · Lens · Entre deux eaux</p>
</header>
<main>

  <div class="section-label">Thème</div>
  <div class="grid" id="theme-grid">
    <button class="btn-select" data-value="amour"><div class="btn-icon">♥</div>Amour</button>
    <button class="btn-select" data-value="famille"><div class="btn-icon">⌂</div>Famille</button>
    <button class="btn-select" data-value="argent"><div class="btn-icon">◈</div>Argent</button>
    <button class="btn-select" data-value="quartier"><div class="btn-icon">▣</div>Quartier</button>
    <button class="btn-select" data-value="conscience"><div class="btn-icon">✊</div>Conscience</button>
    <button class="btn-select" data-value="identite"><div class="btn-icon">◑</div>Identité</button>
  </div>

  <div class="section-label" style="margin-top:1.5rem;">Style musical</div>
  <div class="grid" id="style-grid">
    <button class="btn-select" data-value="drill_sad"><div class="btn-icon">🌧</div>Drill Sad</button>
    <button class="btn-select" data-value="afro"><div class="btn-icon">🌍</div>Afro</button>
    <button class="btn-select" data-value="rnb"><div class="btn-icon">🎵</div>R&B</button>
    <button class="btn-select" data-value="trap"><div class="btn-icon">⚡</div>Trap FR</button>
    <button class="btn-select" data-value="conscious"><div class="btn-icon">📖</div>Conscious</button>
    <button class="btn-select" data-value="melodique"><div class="btn-icon">🎼</div>Mélodique</button>
  </div>

  <div class="custom-label">Ou décris ton propre thème</div>
  <textarea id="custom-input" rows="2" placeholder="Ex : la nuit avant un entretien, les mains de mon père..."></textarea>

  <button class="main-btn" id="generate-btn">Générer le morceau</button>
  <div id="error"></div>

  <div id="lyrics-section">
    <div class="lyrics-header">
      <div class="lyrics-label">— Paroles —</div>
      <button class="save-btn" id="save-btn">💾 Sauvegarder</button>
    </div>
    <div id="lyrics-content"></div>
    <div class="action-row">
      <button class="sec-btn" id="regen-btn">↺ Réécrire</button>
      <button class="sec-btn" id="copy-btn">⧉ Copier</button>
    </div>
  </div>

  <div id="saved-section">
    <div class="saved-title">Mes textes sauvegardés</div>
    <div id="saved-list"></div>
  </div>

</main>
<footer>L'OMBRE — Artiste IA · Creil / Lens</footer>

<script>
var selectedTheme = "";
var selectedStyle = "";
var currentLyrics = "";

var THEMES = {
  amour: "l'amour qu'on cherche et qu'on rate, la solitude affective, vouloir être compris sans expliquer, les relations toxiques, le manque",
  famille: "les liens familiaux, la dette invisible, l'amour difficile à exprimer, la fierté et la honte mêlées, les sacrifices",
  argent: "la dignité face à la précarité, la réussite financière et ce qu'elle coûte, l'ambition, ne plus compter",
  quartier: "la rue, les amis restés, ceux qui sont partis, la nostalgie d'un lieu, grandir dans un environnement difficile",
  conscience: "rap engagé, injustices sociales, mémoire collective, écriture comme résistance, héritage culturel",
  identite: "qui on est vraiment, les masques qu'on porte, l'authenticité, se trouver entre deux mondes"
};


var STYLES = {
  drill_sad: "Drill sad mélancolique : flow lent et posé, 808 lourdes, douleur contenue, images sombres et précises, comme Willylancien ou Central Cee",
  afro: "Afro mélodique : flow chaud, influences africaines, optimisme nuancé, chaleur rythmique, références à l'Afrique et la diaspora, comme Tiakola ou Dadju",
  rnb: "R&B français : mélodique, vulnérable, émotions à fleur de peau, hooks accrocheurs, comme Ninho période intime ou Awa Imani",
  trap: "Trap FR : punchlines percutantes, flow agressif mais intelligent, argot contemporain, références à la rue et à la réussite, comme Freeze Corleone ou PLK",
  conscious: "Rap conscient : flow posé et articulé, vocabulaire riche, références historiques et philosophiques, comme Youssoupha ou Médine",
  melodique: "Rap mélodique : entre chanson et rap, refrains qui restent en tête, émotions universelles, accessible et profond à la fois, comme Leto ou SCH"
};

var STYLE_INFO = {
  drill_sad: "140–150 BPM · 808 lentes · hi-hats glissants · piano froid",
  afro: "100–115 BPM · percussions chaudes · basses rondes · feeling dansant",
  rnb: "70–90 BPM · grosse caisse espacée · snare sur le 3 · très lent",
  trap: "130–145 BPM · hi-hats triplets · 808 puissantes · snare claquante",
  conscious: "85–100 BPM · samples soul/jazz · boom bap · drums organiques",
  melodique: "120–130 BPM · piano mélancolique · drums mid-tempo · nappes"
};


document.querySelectorAll("#theme-grid .btn-select").forEach(function(btn) {
  btn.addEventListener("click", function() {
    document.querySelectorAll("#theme-grid .btn-select").forEach(function(b) { b.classList.remove("active"); });
    btn.classList.add("active");
    selectedTheme = btn.getAttribute("data-value");
    document.getElementById("custom-input").value = "";
  });
});

document.querySelectorAll("#style-grid .btn-select").forEach(function(btn) {
  btn.addEventListener("click", function() {
    document.querySelectorAll("#style-grid .btn-select").forEach(function(b) { b.classList.remove("active"); });
    btn.classList.add("active");
    selectedStyle = btn.getAttribute("data-value");
  });
});

document.getElementById("custom-input").addEventListener("input", function() {
  document.querySelectorAll("#theme-grid .btn-select").forEach(function(b) { b.classList.remove("active"); });
  selectedTheme = "";
});

function renderLyrics(text) {
  currentLyrics = text;
  var container = document.getElementById("lyrics-content");
  container.innerHTML = "";
  var lines = text.split("\n");
  for (var i = 0; i < lines.length; i++) {
    var line = lines[i].replace(/\*\*/g, "").replace(/^#+\s*/, "");
    var div = document.createElement("div");
    if (/^\[.*\]/.test(line.trim())) {
      div.className = "section-tag";
      div.textContent = line;
    } else if (line.trim() === "") {
      div.style.height = "0.6rem";
    } else {
      div.className = "lyric-line";
      div.textContent = line;
      div.contentEditable = "true";
      div.spellcheck = false;
    }
    container.appendChild(div);
  }
  var section = document.getElementById("lyrics-section");
  section.style.display = "block";
  section.scrollIntoView({ behavior: "smooth", block: "start" });
}

async function generate() {
  var custom = document.getElementById("custom-input").value.trim();
  var themeKey = selectedTheme;
  var themeText = custom || (themeKey ? THEMES[themeKey] : "");
  var styleText = selectedStyle ? STYLES[selectedStyle] : STYLES["drill_sad"];

  if (!themeText) return;

  var btn = document.getElementById("generate-btn");
  var errorEl = document.getElementById("error");
  btn.disabled = true;
  btn.textContent = "L'Ombre écrit...";
  errorEl.style.display = "none";
  document.getElementById("lyrics-section").style.display = "none";

  try {
    var res = await fetch("/api/generate", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ theme: themeText, style: styleText })
    });
    var data = await res.json();
    if (data.lyrics) {
      renderLyrics(data.lyrics);
    } else {
      errorEl.textContent = JSON.stringify(data);
      errorEl.style.display = "block";
    }
  } catch (e) {
    errorEl.textContent = "Erreur: " + e.message;
    errorEl.style.display = "block";
  }

  btn.disabled = false;
  btn.textContent = "Générer le morceau";
}

document.getElementById("generate-btn").addEventListener("click", generate);
document.getElementById("regen-btn").addEventListener("click", generate);

document.getElementById("copy-btn").addEventListener("click", function() {
  var lines = document.querySelectorAll("#lyrics-content .lyric-line, #lyrics-content .section-tag");
  var text = "";
  lines.forEach(function(l) { text += l.textContent + "\n"; });
  navigator.clipboard.writeText(text);
  document.getElementById("copy-btn").textContent = "✓ Copié";
  setTimeout(function() { document.getElementById("copy-btn").textContent = "⧉ Copier"; }, 2000);
});

function getSavedTexts() {
  try { return JSON.parse(localStorage.getItem("lombre_saved") || "[]"); } catch(e) { return []; }
}

function renderSaved() {
  var saved = getSavedTexts();
  var section = document.getElementById("saved-section");
  var list = document.getElementById("saved-list");
  if (saved.length === 0) { section.style.display = "none"; return; }
  section.style.display = "block";
  list.innerHTML = "";
  saved.forEach(function(item, idx) {
    var div = document.createElement("div");
    div.className = "saved-item";
    div.innerHTML = '<div><div class="saved-item-title">' + item.title + '</div><div class="saved-item-date">' + item.date + '</div></div><button class="delete-saved" data-idx="' + idx + '">✕</button>';
    div.querySelector(".saved-item-title").addEventListener("click", function() {
      renderLyrics(item.lyrics);
    });
    div.querySelector(".delete-saved").addEventListener("click", function(e) {
      e.stopPropagation();
      var s = getSavedTexts();
      s.splice(idx, 1);
      localStorage.setItem("lombre_saved", JSON.stringify(s));
      renderSaved();
    });
    list.appendChild(div);
  });
}

document.getElementById("save-btn").addEventListener("click", function() {
  if (!currentLyrics) return;
  var lines = currentLyrics.split("\n").filter(function(l) { return l.trim() && !/^\[/.test(l) && !/^#/.test(l); });
  var title = lines[0] ? lines[0].replace(/\*\*/g, "").substring(0, 40) + "..." : "Texte sans titre";
  var saved = getSavedTexts();
  saved.unshift({ title: title, lyrics: currentLyrics, date: new Date().toLocaleDateString("fr-FR") });
  if (saved.length > 20) saved = saved.slice(0, 20);
  localStorage.setItem("lombre_saved", JSON.stringify(saved));
  renderSaved();
  document.getElementById("save-btn").textContent = "✓ Sauvegardé";
  setTimeout(function() { document.getElementById("save-btn").textContent = "💾 Sauvegarder"; }, 2000);
});

renderSaved();
</script>
</body>
</html>
